name: android
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null; "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
      - name: Pruebas de host (C++)
        run: cmake -S app/src/test/cpp -B build-host && cmake --build build-host && ctest --test-dir build-host --output-on-failure
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest assembleRelease -PbuildNumber=${{ github.run_number }} --no-daemon --stacktrace
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Android narration viewport tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            adb shell settings put secure show_ime_with_hard_keyboard 1
            ./gradlew connectedDebugAndroidTest --no-daemon --max-workers=2
            mkdir -p viewport-screenshots
            adb pull /sdcard/Android/data/com.glidelive/files/. viewport-screenshots/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: narration-viewport-results
          path: |
            app/build/reports/androidTests/
            viewport-screenshots/
      - run: cp app/build/outputs/apk/release/app-release.apk GlideLive.apk
      - uses: actions/upload-artifact@v4
        with:
          name: glidelive-release-apk
          path: GlideLive.apk
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest GlideLive.apk --target "$GITHUB_SHA" --prerelease \
            --title "GlideLive build ${{ github.run_number }}" --notes "${{ github.run_number }}"
