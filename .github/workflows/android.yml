name: android
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null; "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
      - name: Pruebas de host (C++)
        run: cmake -S app/src/test/cpp -B build-host && cmake --build build-host && ctest --test-dir build-host --output-on-failure
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest assembleRelease -PbuildNumber=${{ github.run_number }} --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk GlideLive.apk
      - uses: actions/upload-artifact@v4
        with:
          name: glidelive-release-apk
          path: GlideLive.apk
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null; "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
      - run: chmod +x gradlew scripts/ui-test.sh
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Prepare microphone input for the Cuentos test
        run: bash scripts/setup-ui-microphone.sh
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -allow-host-audio -no-boot-anim -camera-back none
          script: |
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            bash scripts/ui-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-results
          path: |
            app/build/reports/androidTests/
            ui-shots/
  publish:
    # Solo se publica desde main y únicamente si pasaron las pruebas de host y las de pantalla en el emulador.
    needs: [build, ui]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: publicar-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: glidelive-release-apk
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          head=$(gh api repos/${{ github.repository }}/commits/main --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then echo "Hay un commit más nuevo en main: no se publica este."; exit 0; fi
          sha256sum GlideLive.apk | awk '{print $1"  GlideLive.apk"}' > GlideLive.apk.sha256
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest GlideLive.apk GlideLive.apk.sha256 --clobber
            gh release edit latest --title "GlideLive build ${{ github.run_number }}" --notes "${{ github.run_number }}" --prerelease
            [ "$(gh release view latest --json body --jq .body)" = "${{ github.run_number }}" ]
          else
            gh release create latest GlideLive.apk GlideLive.apk.sha256 --target "$GITHUB_SHA" --prerelease \
              --title "GlideLive build ${{ github.run_number }}" --notes "${{ github.run_number }}"
          fi
