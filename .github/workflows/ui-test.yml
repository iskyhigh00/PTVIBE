name: ui-test
on:
  push:
    branches: ['ccr-**']
  workflow_dispatch:
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null; "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
      - run: chmod +x gradlew scripts/ui-test.sh
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            bash scripts/ui-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-results
          path: |
            app/build/reports/androidTests/
            ui-shots/
